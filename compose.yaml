services:
  gateway:
    build: .
    image: copilot-personal-go:local
    container_name: copilot-personal-go
    ports:
      - "127.0.0.1:4143:4141"
    env_file: .env
    environment:
      M365_LISTEN: "0.0.0.0:4141"
      M365_DATA_DIR: "/data"
      M365_API_KEYS: "/data/api-keys.json"
      M365_SESSION_CACHE: "/data/sessions.json"
      M365_ADMIN_PASSWORD_FILE: "/data/admin-password"
      M365_ADMIN_PASSWORD_BOOTSTRAP_FILE: "/run/secrets/admin-password"
      M365_CONSUMER_TRANSPORT_URL: "http://consumer:8090"
      M365_CONSUMER_ONLY: "1"
      M365_ACCOUNT_DEFAULT_CONCURRENCY: "1"
      M365_PUBLIC_IDENTITY_POLICY: "false"
      M365_COOKIE_SECURE: "1"
      M365_STRICT_MODEL: "1"
      M365_CONTEXT_WINDOW: "16000"
      M365_MAX_OUTPUT_TOKENS: "4096"
      M365_FORCE_IPV4: "1"
    volumes:
      - go-data:/data
      - ./secrets/admin-password:/run/secrets/admin-password:ro
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4141/webapp/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  consumer:
    build: ./consumer
    image: copilot-consumer-transport:local
    container_name: copilot-consumer-transport
    environment:
      M365_CONSUMER_TRANSPORT_KEY: ${M365_CONSUMER_TRANSPORT_KEY:?Set private transport secret}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  go-data:
