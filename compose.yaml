services:
  hub:
    build: .
    image: copilot-personal-hub:local
    container_name: copilot-personal-hub
    ports:
      - "127.0.0.1:4142:8000"
    env_file: .env
    environment:
      ENABLE_ADMIN_CDP: "false"
      ADMIN_COOKIE_SECURE: "1"
      GITHUB_REPO: "AMDSE/copilot-personal-hub"
      GITHUB_TRACK_REF: "main"
      GIT_COMMIT: "${HUB_BUILD_COMMIT:-unknown}"
      ALLOWED_ORIGINS: "https://copilot.0712121.xyz,https://copilot.microsoft.com"
    volumes:
      - hub-data:/home/app/token
      - hub-browser:/chrome-profile
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.5
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  hub-data:
  hub-browser:
