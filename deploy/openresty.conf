server {
    listen 80;
    server_name copilot.0712121.xyz;
    root /var/www/acme;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name copilot.0712121.xyz;
    ssl_certificate /etc/letsencrypt/live/copilot.0712121.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/copilot.0712121.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    location = /console { return 302 /; }
    location /console/ { return 302 /; }
    location = /self-service { return 302 /; }
    location = /admin { return 302 /; }
    location / { proxy_pass http://127.0.0.1:4143; }
}
